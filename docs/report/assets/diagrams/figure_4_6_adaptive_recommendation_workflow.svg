<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 490" width="950" height="490" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="shadow6" x="-3%" y="-5%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr6-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr6-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="950" height="490" fill="#f8fafc" rx="8"/>
  <rect x="1" y="1" width="948" height="488" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Title Banner -->
  <text x="475" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Adaptive Topic Recommendation &amp; Study Planning Workflow</text>
  <text x="475" y="48" text-anchor="middle" font-size="11" fill="#64748b">Integration of BKT Cognitive Mastery State with Curricular Prerequisite DAG Gating</text>

  <!-- IMPLEMENTATION STATUS LABELS -->
  <rect x="30" y="68" width="410" height="24" fill="#f0fdf4" stroke="#86efac" stroke-width="1" rx="4"/>
  <text x="235" y="84" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#166534">IMPLEMENTED FOUNDATION (Phases 1–6: BKT, Schema &amp; Logs)</text>

  <rect x="490" y="68" width="430" height="24" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1" rx="4"/>
  <text x="705" y="84" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#6b21a8">PROPOSED RECOMMENDATION LOGIC (Slated for Phase 8 Engine)</text>

  <!-- 1. INPUT SOURCES -->
  <g transform="translate(30, 110)">
    <rect width="180" height="150" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6" filter="url(#shadow6)"/>
    <rect width="180" height="26" fill="#1e293b" rx="6 6 0 0"/>
    <text x="90" y="18" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">Student History</text>
    <rect x="10" y="38" width="160" height="45" fill="#f8fafc" stroke="#e2e8f0" rx="4"/>
    <text x="90" y="55" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Interaction Logs</text>
    <text x="90" y="70" text-anchor="middle" font-size="8" fill="#64748b">Trials, hints, timings, accuracy</text>
    
    <rect x="10" y="92" width="160" height="45" fill="#f8fafc" stroke="#e2e8f0" rx="4"/>
    <text x="90" y="109" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Diagnostic Quizzes</text>
    <text x="90" y="124" text-anchor="middle" font-size="8" fill="#64748b">Baseline topic assessments</text>
  </g>

  <!-- ARROW 1 -> 2 -->
  <path d="M 210 185 L 245 185" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr6)"/>

  <!-- 2. BKT MASTERY INFERENCE -->
  <g transform="translate(250, 110)">
    <rect width="180" height="150" fill="#ffffff" stroke="#0f766e" stroke-width="1.5" rx="6" filter="url(#shadow6)"/>
    <rect width="180" height="26" fill="#0f766e" rx="6 6 0 0"/>
    <text x="90" y="18" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">BKT Mastery Engine</text>
    <text x="90" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f766e">P(L_t) Estimation</text>
    <text x="90" y="70" text-anchor="middle" font-size="8.5" fill="#334155">Continuous cognitive belief</text>
    <text x="90" y="84" text-anchor="middle" font-size="8.5" fill="#334155">in [0.0, 1.0] per topic</text>
    
    <rect x="15" y="98" width="150" height="40" fill="#f0fdfa" stroke="#ccfbf1" rx="4"/>
    <text x="90" y="113" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#0f766e">Mastery Cutoff (tau)</text>
    <text x="90" y="128" text-anchor="middle" font-size="8.5" fill="#115e59">Threshold = 0.85</text>
  </g>

  <!-- ARROW 2 -> 3 -->
  <path d="M 430 185 L 485 185" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr6-blue)"/>

  <!-- 3. PREREQUISITE DAG GATING (DECISION NODE) -->
  <g transform="translate(490, 110)">
    <rect width="210" height="160" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" rx="6" filter="url(#shadow6)"/>
    <rect width="210" height="26" fill="#7c3aed" rx="6 6 0 0"/>
    <text x="105" y="18" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">Prerequisite DAG Gating</text>
    
    <!-- Decision Diamond shape representation -->
    <rect x="15" y="38" width="180" height="50" fill="#faf5ff" stroke="#d8b4fe" rx="4"/>
    <text x="105" y="55" text-anchor="middle" font-size="9" font-weight="bold" fill="#6b21a8">Check Topic Dependencies</text>
    <text x="105" y="70" text-anchor="middle" font-size="8" fill="#475569">Are ALL prerequisites</text>
    <text x="105" y="80" text-anchor="middle" font-size="8" fill="#6b21a8">P(L_prereq) &gt;= 0.85?</text>

    <!-- Branch outcomes -->
    <text x="105" y="108" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#dc2626">NO: Deficit Identified</text>
    <text x="105" y="122" text-anchor="middle" font-size="8" fill="#475569">Target topic is BLOCKED</text>
    
    <text x="105" y="142" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#16a34a">YES: Unlocked &amp; Eligible</text>
    <text x="105" y="154" text-anchor="middle" font-size="8" fill="#475569">Eligible for practice review</text>
  </g>

  <!-- ARROWS FROM DECISION TO RECOMMENDATION ACTIONS -->
  <!-- Branch 1: Remedial (NO) -->
  <path d="M 700 150 L 745 150" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr6)"/>
  <!-- Branch 2: Practice / Advanced (YES) -->
  <path d="M 700 230 L 745 230" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr6)"/>

  <!-- 4. RECOMMENDED STUDY ACTIONS -->
  <g transform="translate(750, 100)">
    <rect width="170" height="75" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" rx="6" filter="url(#shadow6)"/>
    <text x="85" y="22" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">Remedial Action</text>
    <text x="85" y="38" text-anchor="middle" font-size="8.5" fill="#b91c1c">Type: REMEDIAL_PREREQUISITE</text>
    <text x="85" y="52" text-anchor="middle" font-size="8" fill="#475569">Priority: 5 (Urgent Blocker)</text>
    <text x="85" y="65" text-anchor="middle" font-size="8" fill="#7f1d1d">Recommend unmastered parent</text>
  </g>

  <g transform="translate(750, 190)">
    <rect width="170" height="75" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" rx="6" filter="url(#shadow6)"/>
    <text x="85" y="22" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">Practice Questions</text>
    <text x="85" y="38" text-anchor="middle" font-size="8.5" fill="#15803d">Type: PRACTICE_QUESTIONS</text>
    <text x="85" y="52" text-anchor="middle" font-size="8" fill="#475569">Priority: 3 (Active Learning)</text>
    <text x="85" y="65" text-anchor="middle" font-size="8" fill="#14532d">Target topic mastery in [0.4, 0.85)</text>
  </g>

  <g transform="translate(750, 280)">
    <rect width="170" height="75" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2" rx="6" filter="url(#shadow6)"/>
    <text x="85" y="22" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">Next Topic / Challenge</text>
    <text x="85" y="38" text-anchor="middle" font-size="8.5" fill="#2563eb">Type: CHALLENGE_ADVANCED</text>
    <text x="85" y="52" text-anchor="middle" font-size="8" fill="#475569">Priority: 1 (Foundational Next)</text>
    <text x="85" y="65" text-anchor="middle" font-size="8" fill="#1e3a8a">Current topic &gt;= 0.85 mastered</text>
  </g>

  <!-- 5. SYNTHESIS OUTPUT -->
  <rect x="180" y="385" width="580" height="65" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6" filter="url(#shadow6)"/>
  <text x="470" y="407" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f172a">Personalized Adaptive Study Plan Output</text>
  <text x="470" y="423" text-anchor="middle" font-size="9" fill="#475569">• Ranked list of daily study items ordered by deficit priority and exam weight</text>
  <text x="470" y="437" text-anchor="middle" font-size="9" fill="#6b21a8">• Prevents cognitive overload by enforcing strictly mastered prerequisite pathways</text>

  <!-- CONNECTING ARROWS TO PLAN -->
  <path d="M 835 355 L 835 417 L 760 417" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr6)"/>
</svg>