<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="950" height="520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="shadow" x="-3%" y="-5%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="950" height="520" fill="#f8fafc" rx="8"/>
  <rect x="1" y="1" width="948" height="518" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Title Banner -->
  <text x="475" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Overall System Architecture &amp; Communication Topology</text>
  <text x="475" y="50" text-anchor="middle" font-size="11" fill="#64748b">Monorepo Multi-Tier Design: Presentation, Application Services, Data Persistence &amp; Machine Learning Inference</text>

  <!-- CLIENT TIER BOUNDARY -->
  <rect x="25" y="70" width="220" height="425" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" rx="8" filter="url(#shadow)"/>
  <rect x="25" y="70" width="220" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="8 8 0 0"/>
  <text x="135" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">1. PRESENTATION TIER</text>
  <text x="135" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">Frontend Client (Vite + React)</text>
  <text x="135" y="136" text-anchor="middle" font-size="9.5" fill="#64748b">Port 5173 • SPA Architecture</text>

  <rect x="40" y="150" width="190" height="65" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" rx="6"/>
  <text x="135" y="172" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">Diagnostic Study Dashboard</text>
  <text x="135" y="188" text-anchor="middle" font-size="9" fill="#3b82f6">• Real-time topic mastery rings</text>
  <text x="135" y="202" text-anchor="middle" font-size="9" fill="#3b82f6">• Weak-area review alerts</text>

  <rect x="40" y="225" width="190" height="65" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" rx="6"/>
  <text x="135" y="247" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">Adaptive Practice &amp; Quiz UI</text>
  <text x="135" y="263" text-anchor="middle" font-size="9" fill="#3b82f6">• Question rendering &amp; timer</text>
  <text x="135" y="277" text-anchor="middle" font-size="9" fill="#3b82f6">• Instant feedback telemetry</text>

  <rect x="40" y="300" width="190" height="65" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" rx="6"/>
  <text x="135" y="322" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">Prerequisite DAG Graph View</text>
  <text x="135" y="338" text-anchor="middle" font-size="9" fill="#3b82f6">• Visual dependency graph</text>
  <text x="135" y="352" text-anchor="middle" font-size="9" fill="#3b82f6">• Locked / unlocked topic states</text>

  <rect x="40" y="375" width="190" height="65" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="135" y="397" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#475569">Client-Side State &amp; Cache</text>
  <text x="135" y="413" text-anchor="middle" font-size="9" fill="#64748b">• React Context / Axios / Query</text>
  <text x="135" y="427" text-anchor="middle" font-size="9" fill="#64748b">• Optimistic state transitions</text>

  <text x="135" y="475" text-anchor="middle" font-size="9" fill="#94a3b8">Runs in Modern Web Browsers</text>

  <!-- ARROWS: Frontend <-> Backend -->
  <path d="M 245 220 L 350 220" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 350 240 L 245 240" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <rect x="252" y="202" width="90" height="16" fill="#ffffff" rx="3"/>
  <text x="297" y="214" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#2563eb">HTTP POST (Quiz)</text>
  <rect x="252" y="244" width="90" height="16" fill="#ffffff" rx="3"/>
  <text x="297" y="256" text-anchor="middle" font-size="8.5" fill="#475569">JSON Response</text>

  <!-- APPLICATION TIER BOUNDARY -->
  <rect x="355" y="70" width="250" height="425" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" filter="url(#shadow)"/>
  <rect x="355" y="70" width="250" height="32" fill="#1e293b" rx="8 8 0 0"/>
  <text x="480" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2. APPLICATION TIER</text>
  <text x="480" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Node.js + Express REST API</text>
  <text x="480" y="136" text-anchor="middle" font-size="9.5" fill="#64748b">Port 5000 • Modular Micro-Controllers</text>

  <rect x="370" y="150" width="220" height="55" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="480" y="170" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f172a">Route Handlers &amp; Middleware</text>
  <text x="480" y="186" text-anchor="middle" font-size="9" fill="#475569">/api/v1/auth, /topics, /interactions</text>
  <text x="480" y="198" text-anchor="middle" font-size="9" fill="#64748b">CORS, Morgan, Input Validation (Zod)</text>

  <rect x="370" y="215" width="220" height="55" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="480" y="235" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f172a">Learning Service Controller</text>
  <text x="480" y="251" text-anchor="middle" font-size="9" fill="#475569">Logs student response to DB</text>
  <text x="480" y="263" text-anchor="middle" font-size="9" fill="#2563eb">Triggers ML inference webhook</text>

  <rect x="370" y="280" width="220" height="55" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="480" y="300" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f172a">Recommendation Service [Proposed]</text>
  <text x="480" y="316" text-anchor="middle" font-size="9" fill="#7c3aed">Prerequisite DAG Gating Logic</text>
  <text x="480" y="328" text-anchor="middle" font-size="9" fill="#64748b">Weakness scoring &amp; study plan synthesis</text>

  <rect x="370" y="345" width="220" height="70" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" rx="6"/>
  <text x="480" y="365" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#166534">Prisma ORM Client Layer</text>
  <text x="480" y="381" text-anchor="middle" font-size="9" fill="#15803d">Auto-generated TypeScript Client</text>
  <text x="480" y="395" text-anchor="middle" font-size="9" fill="#15803d">Connection Pool (5-10 clients)</text>
  <text x="480" y="407" text-anchor="middle" font-size="8.5" fill="#4ade80">Type-Safe Relational Queries</text>

  <text x="480" y="475" text-anchor="middle" font-size="9" fill="#94a3b8">Asynchronous Non-Blocking Event Loop</text>

  <!-- ARROWS: Backend <-> ML Service -->
  <path d="M 605 230 L 705 230" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 705 250 L 605 250" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <rect x="615" y="212" width="85" height="16" fill="#ffffff" rx="3"/>
  <text x="657" y="224" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#2563eb">REST /predict</text>
  <rect x="615" y="254" width="85" height="16" fill="#ffffff" rx="3"/>
  <text x="657" y="266" text-anchor="middle" font-size="8.5" fill="#475569">P(L_t) Update</text>

  <!-- ML SERVICE TIER BOUNDARY -->
  <rect x="710" y="70" width="215" height="230" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" filter="url(#shadow)"/>
  <rect x="710" y="70" width="215" height="32" fill="#0f766e" rx="8 8 0 0"/>
  <text x="817" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3. ML SERVICE TIER</text>
  <text x="817" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Python + FastAPI Engine</text>
  <text x="817" y="136" text-anchor="middle" font-size="9.5" fill="#64748b">Port 8000 • Uvicorn ASGI Worker</text>

  <rect x="725" y="150" width="185" height="50" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1" rx="6"/>
  <text x="817" y="170" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f766e">BKT Inference Engine</text>
  <text x="817" y="186" text-anchor="middle" font-size="9" fill="#115e59">Online Bayesian Belief Updating</text>
  <text x="817" y="196" text-anchor="middle" font-size="8.5" fill="#0d9488">Corbett &amp; Anderson (1994)</text>

  <rect x="725" y="210" width="185" height="45" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1" rx="6"/>
  <text x="817" y="228" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f766e">Calibrated Skill Model Params</text>
  <text x="817" y="244" text-anchor="middle" font-size="9" fill="#115e59">P(L_0), T, G, S fit via EM / WPI Data</text>

  <text x="817" y="285" text-anchor="middle" font-size="9" fill="#94a3b8">Stateless Analytical Service</text>

  <!-- DATABASE PERSISTENCE TIER BOUNDARY -->
  <rect x="710" y="315" width="215" height="180" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" filter="url(#shadow)"/>
  <rect x="710" y="315" width="215" height="32" fill="#334155" rx="8 8 0 0"/>
  <text x="817" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">4. PERSISTENCE TIER</text>
  <text x="817" y="364" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">PostgreSQL Relational DB</text>
  <text x="817" y="380" text-anchor="middle" font-size="9.5" fill="#64748b">Port 5432 • 11 Relational Models</text>

  <rect x="725" y="392" width="185" height="50" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="817" y="410" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">11 Normalized Tables</text>
  <text x="817" y="424" text-anchor="middle" font-size="8.5" fill="#475569">users, topics, interactions, masteries,</text>
  <text x="817" y="436" text-anchor="middle" font-size="8.5" fill="#475569">questions, topic_prerequisites (DAG)</text>

  <text x="817" y="475" text-anchor="middle" font-size="9" fill="#94a3b8">ACID Compliance &amp; Referential Integrity</text>

  <!-- ARROW: Backend <-> Database -->
  <path d="M 590 380 L 710 380" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <path d="M 710 395 L 590 395" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <rect x="618" y="364" width="80" height="15" fill="#ffffff" rx="3"/>
  <text x="658" y="375" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#0d9488">TCP Port 5432</text>
  <rect x="618" y="400" width="80" height="15" fill="#ffffff" rx="3"/>
  <text x="658" y="411" text-anchor="middle" font-size="8.5" fill="#475569">SQL Records</text>
</svg>