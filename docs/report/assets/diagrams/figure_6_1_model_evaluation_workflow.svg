<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 490" width="950" height="490" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="shadow7" x="-3%" y="-5%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="950" height="490" fill="#f8fafc" rx="8"/>
  <rect x="1" y="1" width="948" height="488" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Title Banner -->
  <text x="475" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">BKT Machine Learning Model Evaluation &amp; Calibration Architecture</text>
  <text x="475" y="50" text-anchor="middle" font-size="11" fill="#64748b">Rigorous Scientific Assessment: Discrimination (ROC-AUC), Loss (Brier / Log Loss) &amp; Calibration (ECE)</text>

  <!-- 1. DATA SPLITTING -->
  <g transform="translate(30, 80)">
    <rect width="180" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6" filter="url(#shadow7)"/>
    <rect width="180" height="28" fill="#1e293b" rx="6 6 0 0"/>
    <text x="90" y="19" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">1. Data Partitioning</text>

    <rect x="15" y="45" width="150" height="80" fill="#f8fafc" stroke="#e2e8f0" rx="4"/>
    <text x="90" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">Student-Stratified Split</text>
    <text x="90" y="80" text-anchor="middle" font-size="8.5" fill="#475569">3,676 Total Students</text>
    <text x="90" y="94" text-anchor="middle" font-size="8.5" fill="#475569">Zero-leakage grouping</text>
    <text x="90" y="108" text-anchor="middle" font-size="8" fill="#dc2626">No cross-split overlap</text>

    <rect x="15" y="140" width="150" height="45" fill="#eff6ff" stroke="#bfdbfe" rx="4"/>
    <text x="90" y="158" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1e40af">Training: 80%</text>
    <text x="90" y="172" text-anchor="middle" font-size="8" fill="#2563eb">2,940 Students (259K trials)</text>

    <rect x="15" y="195" width="150" height="45" fill="#faf5ff" stroke="#d8b4fe" rx="4"/>
    <text x="90" y="213" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#6b21a8">Validation: 10%</text>
    <text x="90" y="227" text-anchor="middle" font-size="8" fill="#7c3aed">368 Students (32K trials)</text>

    <rect x="15" y="250" width="150" height="45" fill="#f0fdf4" stroke="#bbf7d0" rx="4"/>
    <text x="90" y="268" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#166534">Test Set: 10%</text>
    <text x="90" y="282" text-anchor="middle" font-size="8" fill="#16a34a">368 Students (32K trials)</text>
  </g>

  <!-- ARROW 1 -> 2 -->
  <path d="M 210 220 L 245 220" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr7)"/>

  <!-- 2. MODEL TRAINING & BASELINES -->
  <g transform="translate(250, 80)">
    <rect width="210" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6" filter="url(#shadow7)"/>
    <rect width="210" height="28" fill="#0f766e" rx="6 6 0 0"/>
    <text x="105" y="19" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">2. Model Fitting &amp; Baselines</text>

    <rect x="15" y="45" width="180" height="95" fill="#f0fdfa" stroke="#99f6e4" rx="4"/>
    <text x="105" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f766e">BKT Parameter Fitting</text>
    <text x="105" y="80" text-anchor="middle" font-size="8.5" fill="#115e59">Expectation-Maximization (EM)</text>
    <text x="105" y="93" text-anchor="middle" font-size="8" fill="#475569">Baum-Welch algorithm per skill</text>
    <text x="105" y="106" text-anchor="middle" font-size="8" fill="#475569">Bounded grid search optimization</text>
    <text x="105" y="120" text-anchor="middle" font-size="8" fill="#0f766e">Learns: P(L_0), T, G, S</text>

    <rect x="15" y="150" width="180" height="155" fill="#f8fafc" stroke="#e2e8f0" rx="4"/>
    <text x="105" y="170" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#334155">Benchmark Baselines</text>
    
    <text x="25" y="190" font-size="8.5" font-weight="bold" fill="#0f172a">• Majority Class:</text>
    <text x="35" y="202" font-size="8" fill="#64748b">Always predicts 1 (65.88%)</text>

    <text x="25" y="220" font-size="8.5" font-weight="bold" fill="#0f172a">• Global Mean:</text>
    <text x="35" y="232" font-size="8" fill="#64748b">Constant P = 0.6588</text>

    <text x="25" y="250" font-size="8.5" font-weight="bold" fill="#0f172a">• Skill-Specific Mean:</text>
    <text x="35" y="262" font-size="8" fill="#64748b">Historical avg accuracy per skill</text>

    <text x="25" y="280" font-size="8.5" font-weight="bold" fill="#0f172a">• Static BKT Parameters:</text>
    <text x="35" y="292" font-size="8" fill="#64748b">Default Corbett-Anderson values</text>
  </g>

  <!-- ARROW 2 -> 3 -->
  <path d="M 460 220 L 495 220" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr7)"/>

  <!-- 3. TEST EVALUATION & METRICS -->
  <g transform="translate(500, 80)">
    <rect width="210" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6" filter="url(#shadow7)"/>
    <rect width="210" height="28" fill="#2563eb" rx="6 6 0 0"/>
    <text x="105" y="19" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">3. Performance Metrics</text>

    <rect x="15" y="45" width="180" height="70" fill="#eff6ff" stroke="#bfdbfe" rx="4"/>
    <text x="105" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">Discrimination (ROC-AUC)</text>
    <text x="105" y="80" text-anchor="middle" font-size="8.5" fill="#334155">Ranks correct vs incorrect</text>
    <text x="105" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">Protocol A: 0.7135</text>
    <text x="105" y="108" text-anchor="middle" font-size="8" fill="#1e40af">Protocol B: 0.7319</text>

    <rect x="15" y="125" width="180" height="60" fill="#eff6ff" stroke="#bfdbfe" rx="4"/>
    <text x="105" y="145" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">Log Loss (Cross-Entropy)</text>
    <text x="105" y="161" text-anchor="middle" font-size="8.5" fill="#334155">Penalty for overconfident error</text>
    <text x="105" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">0.5697 (vs 0.6409 Baseline)</text>

    <rect x="15" y="195" width="180" height="60" fill="#eff6ff" stroke="#bfdbfe" rx="4"/>
    <text x="105" y="215" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">Brier Score (MSE)</text>
    <text x="105" y="231" text-anchor="middle" font-size="8.5" fill="#334155">Mean squared forecast error</text>
    <text x="105" y="246" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">0.1928 (vs 0.2248 Baseline)</text>

    <rect x="15" y="265" width="180" height="50" fill="#eff6ff" stroke="#bfdbfe" rx="4"/>
    <text x="105" y="285" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">Accuracy (at tau = 0.5)</text>
    <text x="105" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">71.32%</text>
  </g>

  <!-- ARROW 3 -> 4 -->
  <path d="M 710 220 L 745 220" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr7)"/>

  <!-- 4. CALIBRATION & RELIABILITY -->
  <g transform="translate(750, 80)">
    <rect width="170" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6" filter="url(#shadow7)"/>
    <rect width="170" height="28" fill="#16a34a" rx="6 6 0 0"/>
    <text x="85" y="19" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">4. Calibration Audit</text>

    <rect x="10" y="45" width="150" height="85" fill="#f0fdf4" stroke="#86efac" rx="4"/>
    <text x="85" y="65" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">Expected Calibration</text>
    <text x="85" y="78" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">Error (ECE)</text>
    <text x="85" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">0.006872</text>
    <text x="85" y="114" text-anchor="middle" font-size="9" font-weight="bold" fill="#16a34a">(0.69% Error)</text>

    <rect x="10" y="140" width="150" height="110" fill="#f8fafc" stroke="#e2e8f0" rx="4"/>
    <text x="85" y="160" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">Reliability Diagram</text>
    <text x="85" y="176" text-anchor="middle" font-size="8" fill="#475569">10 Decile Bins [0, 1]</text>
    <text x="85" y="192" text-anchor="middle" font-size="8" fill="#475569">Bin 5 (0.4-0.5): 46.9% acc</text>
    <text x="85" y="206" text-anchor="middle" font-size="8" fill="#475569">Bin 7 (0.6-0.7): 65.5% acc</text>
    <text x="85" y="220" text-anchor="middle" font-size="8" fill="#475569">Bin 9 (0.8-0.9): 85.0% acc</text>
    <text x="85" y="238" text-anchor="middle" font-size="8" font-weight="bold" fill="#166534">Exceptional Alignment</text>

    <rect x="10" y="260" width="150" height="50" fill="#f0fdf4" stroke="#86efac" rx="4"/>
    <text x="85" y="278" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#166534">Trustworthy Output</text>
    <text x="85" y="294" text-anchor="middle" font-size="8" fill="#15803d">Predicted probabilities</text>
    <text x="85" y="304" text-anchor="middle" font-size="8" fill="#15803d">reflect true student accuracy</text>
  </g>

  <text x="475" y="455" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">Empirical Verification: 56 Automated Tests Passed • 100% Alignment with Published Corbett &amp; Anderson Benchmark Standards</text>
</svg>