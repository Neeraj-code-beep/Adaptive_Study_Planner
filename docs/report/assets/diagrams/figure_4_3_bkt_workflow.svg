<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <filter id="shadow3" x="-3%" y="-5%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr3-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="920" height="460" fill="#f8fafc" rx="8"/>
  <rect x="1" y="1" width="918" height="458" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <!-- Title Banner -->
  <text x="460" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Bayesian Knowledge Tracing (BKT) Mathematical Workflow</text>
  <text x="460" y="50" text-anchor="middle" font-size="11" fill="#64748b">Sequential Latent State Inference &amp; Probability Transition at Trial Step t</text>

  <!-- STEP 1: PRIOR KNOWLEDGE STATE -->
  <rect x="30" y="140" width="160" height="150" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" filter="url(#shadow3)"/>
  <rect x="30" y="140" width="160" height="28" fill="#1e293b" rx="8 8 0 0"/>
  <text x="110" y="159" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">Step 1: Prior Belief</text>
  <text x="110" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">P(L_t)</text>
  <text x="110" y="215" text-anchor="middle" font-size="9" fill="#475569">Probability that student</text>
  <text x="110" y="228" text-anchor="middle" font-size="9" fill="#475569">has mastered topic</text>
  <text x="110" y="242" text-anchor="middle" font-size="9" fill="#475569">before trial t</text>
  <text x="110" y="265" text-anchor="middle" font-size="8.5" fill="#64748b">(At t=1, P(L_1) = P(L_0))</text>

  <!-- ARROW 1 -> 2 -->
  <path d="M 190 215 L 240 215" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- STEP 2: PREDICTION STEP -->
  <rect x="245" y="140" width="180" height="150" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" filter="url(#shadow3)"/>
  <rect x="245" y="140" width="180" height="28" fill="#0f766e" rx="8 8 0 0"/>
  <text x="335" y="159" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">Step 2: Observation Forecast</text>
  <text x="335" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f766e">P(C_t = 1)</text>
  <text x="335" y="210" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">P(L_t)(1 - S) + (1 - P(L_t))G</text>
  <text x="335" y="235" text-anchor="middle" font-size="9" fill="#475569">Predicted probability of</text>
  <text x="335" y="248" text-anchor="middle" font-size="9" fill="#475569">correct response on trial t</text>
  <text x="335" y="268" text-anchor="middle" font-size="8.5" fill="#64748b">Slip (S) &amp; Guess (G) factored</text>

  <!-- ARROW 2 -> 3 -->
  <path d="M 425 215 L 475 215" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- STEP 3: OBSERVE OUTCOME -->
  <rect x="480" y="120" width="160" height="190" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" filter="url(#shadow3)"/>
  <rect x="480" y="120" width="160" height="28" fill="#475569" rx="8 8 0 0"/>
  <text x="560" y="139" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">Step 3: Actual Trial</text>
  <text x="560" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">Observed Outcome y_t</text>
  
  <rect x="495" y="185" width="130" height="50" fill="#f0fdf4" stroke="#86efac" stroke-width="1" rx="4"/>
  <text x="560" y="205" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">CORRECT (y_t = 1)</text>
  <text x="560" y="222" text-anchor="middle" font-size="8.5" fill="#15803d">Direct answer / no hint</text>

  <rect x="495" y="245" width="130" height="50" fill="#fef2f2" stroke="#fecaca" stroke-width="1" rx="4"/>
  <text x="560" y="265" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">INCORRECT (y_t = 0)</text>
  <text x="560" y="282" text-anchor="middle" font-size="8.5" fill="#b91c1c">Wrong attempt / hint used</text>

  <!-- ARROWS 3 -> 4 (Branching) -->
  <path d="M 640 210 L 690 190" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr3)"/>
  <path d="M 640 230 L 690 250" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- STEP 4: BAYESIAN UPDATE & TRANSITION -->
  <rect x="695" y="80" width="200" height="270" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" filter="url(#shadow3)"/>
  <rect x="695" y="80" width="200" height="28" fill="#1e293b" rx="8 8 0 0"/>
  <text x="795" y="99" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff">Step 4: Posterior &amp; Transition</text>

  <!-- Posterior formulas -->
  <rect x="705" y="118" width="180" height="85" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" rx="5"/>
  <text x="795" y="135" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e40af">Bayesian Posterior P(L_t | y_t)</text>
  <text x="795" y="152" text-anchor="middle" font-size="8" fill="#1e293b">If Correct (y_t = 1):</text>
  <text x="795" y="165" text-anchor="middle" font-size="8" font-weight="bold" fill="#1e40af">P(L_t)(1 - S) / P(C_t = 1)</text>
  <text x="795" y="180" text-anchor="middle" font-size="8" fill="#1e293b">If Incorrect (y_t = 0):</text>
  <text x="795" y="193" text-anchor="middle" font-size="8" font-weight="bold" fill="#b91c1c">P(L_t)S / (1 - P(C_t = 1))</text>

  <!-- Transition formula -->
  <rect x="705" y="215" width="180" height="70" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" rx="5"/>
  <text x="795" y="233" text-anchor="middle" font-size="9" font-weight="bold" fill="#166534">Learning Transition Step</text>
  <text x="795" y="249" text-anchor="middle" font-size="8" fill="#15803d">P(L_{t+1}) = Posterior +</text>
  <text x="795" y="262" text-anchor="middle" font-size="8" font-weight="bold" fill="#15803d">(1 - Posterior) * T</text>
  <text x="795" y="276" text-anchor="middle" font-size="7.5" fill="#475569">Where T = Learning Rate P(T)</text>

  <rect x="705" y="295" width="180" height="45" fill="#1e293b" rx="4"/>
  <text x="795" y="313" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#38bdf8">Updated Mastery P(L_{t+1})</text>
  <text x="795" y="327" text-anchor="middle" font-size="8" fill="#94a3b8">Carried forward as Prior for trial t+1</text>

  <!-- RECURSION FEEDBACK LOOP ARROW -->
  <path d="M 795 350 L 795 410 L 110 410 L 110 295" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arr3-blue)"/>
  <rect x="360" y="398" width="200" height="22" fill="#ffffff" stroke="#2563eb" stroke-width="1" rx="4"/>
  <text x="460" y="413" text-anchor="middle" font-size="9" font-weight="bold" fill="#2563eb">Temporal Feedback Loop (Next Trial Step t+1)</text>
</svg>